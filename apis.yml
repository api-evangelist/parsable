aid: parsable
name: Parsable
description: >-
  Parsable is a Connected Worker platform for manufacturing and industrial operations. Its mobile-first
  software replaces paper-based standard operating procedures with digital work instructions, guiding
  frontline workers through audits, inspections, maintenance, safety, quality, and production workflows
  while capturing real-time execution data. The platform surfaces analytics and insights that help
  enterprises like Coca-Cola, Grupo Bimbo, and other global CPG and industrial manufacturers reduce
  downtime, standardize processes, and drive continuous improvement. Parsable exposes a token-authenticated
  JSON API (api.parsable.net) organized into 17 modules for jobs, templates, field data, messaging,
  reporting, and analytics, plus an oclif-based command-line tool (parsable-cli) for administration and
  data integration. Originally founded as Wearable Intelligence, Parsable is headquartered in Lincoln, RI.
