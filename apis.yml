apis:
- name: Parsable Connected Worker API
  description: >-
    Token-authenticated JSON API for the Parsable Connected Worker platform. All calls are HTTP POSTs to
    https://api.parsable.net/api/<MODULE> carrying a `{ "method", "arguments" }` envelope and an
    Authorization: Token <jwt> header. Organized into 17 modules (Job, Job Template, Field Data, Messaging,
    Reporting, Analytics, Team, User, Notification, and more) used to automate job planning, trigger
    workflows, generate reports, and extract execution data.
